name: Publish Fungo Italia beta from source branch
# Redeploy request 2026-10-09
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout approved beta source
        uses: actions/checkout@v4
        with:
          repository: gianpaolobol/fungo-italia
          ref: release/beta-primary-review-20261008
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '24.3.0'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Build beta
        working-directory: source
        run: |
          npm ci
          npm run prepare:data
          cd web && npm ci && npm run build
      - name: Verify beta content
        working-directory: source
        run: |
          test -s dist-ios/data.json
          node -e "const d=require('./dist-ios/data.json');if(d.catalog.length!==148||d.groups.length!==66)process.exit(1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist-ios
      - id: deployment
        uses: actions/deploy-pages@v4
